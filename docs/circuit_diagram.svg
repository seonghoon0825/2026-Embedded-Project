<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .label { font: 600 18px Arial, sans-serif; fill: #111827; }
      .small { font: 14px Arial, sans-serif; fill: #374151; }
      .pin { font: 13px Arial, sans-serif; fill: #111827; }
      .box { fill: #f9fafb; stroke: #111827; stroke-width: 2; rx: 12; }
      .module { fill: #eef2ff; stroke: #3730a3; stroke-width: 2; rx: 10; }
      .sensor { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 10; }
      .servo { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 10; }
      .power { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2; rx: 10; }
      .wire5v { stroke: #dc2626; stroke-width: 4; fill: none; }
      .wireGnd { stroke: #111827; stroke-width: 4; fill: none; }
      .wireSig { stroke: #2563eb; stroke-width: 4; fill: none; }
      .wireEcho { stroke: #059669; stroke-width: 4; fill: none; }
      .node { fill: #111827; }
      .resistor { fill: #ffffff; stroke: #111827; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1100" height="720" fill="#ffffff"/>
  <text x="40" y="55" class="title">Smart Trash Can Circuit Diagram</text>
  <text x="40" y="84" class="small">ESP32 + HC-SR04 ultrasonic sensor + servo motor, with Echo voltage divider and common ground.</text>

  <rect x="445" y="145" width="250" height="430" class="module"/>
  <text x="540" y="180" text-anchor="middle" class="label">ESP32</text>
  <text x="475" y="235" class="pin">5V/VIN</text>
  <text x="475" y="285" class="pin">GND</text>
  <text x="475" y="335" class="pin">GPIO 5 / TRIG</text>
  <text x="475" y="385" class="pin">GPIO 18 / ECHO</text>
  <text x="475" y="435" class="pin">GPIO 19 / SERVO</text>
  <text x="475" y="510" class="pin">GND</text>

  <rect x="70" y="150" width="230" height="210" class="sensor"/>
  <text x="185" y="185" text-anchor="middle" class="label">HC-SR04</text>
  <text x="105" y="235" class="pin">VCC</text>
  <text x="105" y="275" class="pin">GND</text>
  <text x="105" y="315" class="pin">TRIG</text>
  <text x="105" y="355" class="pin">ECHO</text>

  <rect x="785" y="175" width="230" height="180" class="servo"/>
  <text x="900" y="210" text-anchor="middle" class="label">Servo Motor</text>
  <text x="820" y="260" class="pin">Signal</text>
  <text x="820" y="300" class="pin">VCC 5V</text>
  <text x="820" y="340" class="pin">GND</text>

  <rect x="785" y="455" width="230" height="120" class="power"/>
  <text x="900" y="490" text-anchor="middle" class="label">External 5V</text>
  <text x="825" y="535" class="pin">+5V</text>
  <text x="825" y="565" class="pin">GND</text>

  <path d="M300 230 H445" class="wire5v"/>
  <text x="322" y="218" class="small">5V</text>

  <path d="M300 270 H420 V285 H445" class="wireGnd"/>
  <text x="322" y="262" class="small">GND</text>

  <path d="M300 310 H420 V335 H445" class="wireSig"/>
  <text x="320" y="302" class="small">TRIG</text>

  <path d="M300 350 H355" class="wireEcho"/>
  <rect x="355" y="338" width="60" height="24" class="resistor"/>
  <text x="385" y="355" text-anchor="middle" class="small">1k</text>
  <path d="M415 350 H445 V385" class="wireEcho"/>
  <circle cx="415" cy="350" r="5" class="node"/>
  <path d="M415 350 V435" class="wireGnd"/>
  <rect x="403" y="435" width="24" height="60" class="resistor"/>
  <text x="415" y="470" text-anchor="middle" class="small">2k</text>
  <path d="M415 495 V510 H445" class="wireGnd"/>
  <text x="325" y="390" class="small">Echo divider to 3.3V</text>

  <path d="M695 435 H740 V260 H785" class="wireSig"/>
  <text x="710" y="422" class="small">PWM</text>

  <path d="M785 535 H745 V300 H785" class="wire5v"/>
  <text x="650" y="295" class="small">Servo +5V</text>

  <path d="M785 565 H720 V340 H785" class="wireGnd"/>
  <path d="M720 565 V510 H695" class="wireGnd"/>
  <text x="706" y="595" class="small">Common GND</text>

  <circle cx="300" cy="230" r="4" fill="#dc2626"/>
  <circle cx="300" cy="270" r="4" fill="#111827"/>
  <circle cx="300" cy="310" r="4" fill="#2563eb"/>
  <circle cx="300" cy="350" r="4" fill="#059669"/>
  <circle cx="785" cy="260" r="4" fill="#2563eb"/>
  <circle cx="785" cy="300" r="4" fill="#dc2626"/>
  <circle cx="785" cy="340" r="4" fill="#111827"/>
  <circle cx="695" cy="235" r="4" fill="#dc2626"/>
  <circle cx="695" cy="285" r="4" fill="#111827"/>
  <circle cx="695" cy="335" r="4" fill="#2563eb"/>
  <circle cx="695" cy="385" r="4" fill="#059669"/>
  <circle cx="695" cy="435" r="4" fill="#2563eb"/>
  <circle cx="695" cy="510" r="4" fill="#111827"/>

  <rect x="70" y="610" width="960" height="70" class="box"/>
  <text x="95" y="640" class="small">Pin map: TRIG = GPIO 5, ECHO = GPIO 18 through 1k/2k divider, SERVO = GPIO 19.</text>
  <text x="95" y="665" class="small">Important: Servo VCC uses external 5V. External 5V GND and ESP32 GND must be connected together.</text>
</svg>
